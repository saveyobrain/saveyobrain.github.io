<!doctype html>
<html lang="en">

  <body>
    <div class="site-page">
      <header class="site-header">
        <a class="site-brand" href="/">

          <span class="site-brand-text">Save Yo Brain</span>
        </a>
        <button

        <section class="hub-hero">
          <h1 class="hub-headline">Free games to keep your brain strong.</h1>
          <p class="hub-intro">
            Math is a basic skill, just like reading and writing. Play a little every day to build it
            up and keep it sharp.

          <p class="hub-hero-cta">
            <a class="btn btn-primary" href="/games/save-the-light/">Play Save the Light</a>
          </p>

        <p class="hub-note">Play right away, no account needed. Progress is saved in your browser.</p>
