<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Save Yo Brain">
  <!-- Smooth upright oval (reference: top-down brain silhouette, no side lobes) -->
  <path fill="#ffb07a" stroke="#3b3350" stroke-width="2.4" stroke-linejoin="round"
    d="M32 5.5
       C45.5 5.5 52.5 16.5 52.5 32
       C52.5 47.5 45.5 58.5 32 58.5
       C18.5 58.5 11.5 47.5 11.5 32
       C11.5 16.5 18.5 5.5 32 5.5Z"/>
  <!-- Soft hemisphere tint -->
  <path fill="#ff9a5c" opacity="0.28"
    d="M32 5.5C18.5 5.5 11.5 16.5 11.5 32C11.5 47.5 18.5 58.5 32 58.5V5.5Z"/>
  <path fill="#ffc49a" opacity="0.35"
    d="M32 5.5C45.5 5.5 52.5 16.5 52.5 32C52.5 47.5 45.5 58.5 32 58.5V5.5Z"/>
  <!-- Longitudinal fissure -->
  <path fill="none" stroke="#3b3350" stroke-width="2.2" stroke-linecap="round" d="M32 10v44"/>
  <!-- Letters -->
  <text x="22" y="40" text-anchor="middle"
    font-family="ui-rounded, 'Segoe UI Rounded', 'Nunito', 'Segoe UI', system-ui, sans-serif"
    font-size="22" font-weight="800" fill="#3b3350">S</text>
  <text x="42" y="40" text-anchor="middle"
    font-family="ui-rounded, 'Segoe UI Rounded', 'Nunito', 'Segoe UI', system-ui, sans-serif"
    font-size="22" font-weight="800" fill="#3b3350">B</text>
</svg>
